---
layout: default
---
<p class="eyebrow">{{ page.eyebrow }}</p>
<h1 class="display-title">{{ page.headline | markdownify | remove: "<p>" | remove: "</p>" | strip }}</h1>
<div class="whetstone" aria-hidden="true"></div>
<div class="lead">{{ content }}</div>
<ul class="services" aria-label="Services">
  {% for service in page.services %}<li>{{ service }}</li>
  {% endfor %}
</ul>
<a class="call-to-action" href="{{ '/contact/' | relative_url }}">{{ page.call_to_action }}</a>
