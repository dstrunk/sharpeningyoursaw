---
layout: default
title: Contact
permalink: /contact/
---
<div class="contact">
  <div class="contact-intro">
    <h1 class="display-title display-title--small">Contact</h1>
    <p>Send a message and we'll get back to you.</p>
  </div>

  <form class="contact-form" method="post" action="{{ site.google_form.action }}">
    <div class="field-row">
      <div class="field">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="{{ site.google_form.entries.name }}" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="contact-email">Email</label>
        <input id="contact-email" name="{{ site.google_form.entries.email }}" type="email" autocomplete="email" required>
      </div>
    </div>
    <div class="field">
      <label for="contact-subject">Subject</label>
      <input id="contact-subject" name="{{ site.google_form.entries.subject }}" type="text">
    </div>
    <div class="field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="{{ site.google_form.entries.message }}" rows="6" required></textarea>
    </div>
    <div class="honeypot" aria-hidden="true">
      <label for="contact-leave-blank">Leave this field blank</label>
      <input id="contact-leave-blank" type="text" tabindex="-1" autocomplete="off">
    </div>
    <p class="form-error" role="alert" hidden>Your message couldn't be sent. Please try again in a moment.</p>
    <button class="submit-button" type="submit">Send message</button>
  </form>
</div>
<script src="{{ '/assets/contact.js' | relative_url }}" defer></script>
