services:
  jekyll:
    image: ruby:3.3.4
    working_dir: /site
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/"]
      interval: 3s
      retries: 100
      start_period: 300s

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      BASE_URL: http://jekyll:4000
    depends_on:
      jekyll:
        condition: service_healthy
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

  unit:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
    command: node --test tests/unit

volumes:
  bundle:
  node_modules:
